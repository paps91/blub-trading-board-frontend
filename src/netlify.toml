[build]
  command = "npm run build"
  publish = "dist"

# Gestion du routage SPA (pour React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers pour permettre les cookies cross-origin
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://blub-trading-board.onrender.com"
    Access-Control-Allow-Credentials = "true"